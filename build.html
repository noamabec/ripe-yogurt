<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>יוגורט בהרכבה · RIPE Yogurt</title>
  <meta name="description" content="מרכיבים יוגורט קפוא בדיוק כמו שאוהבים: גודל, בסיס, פירות העונה, קראנץ' ורוטב, ורואים את הכוס נבנית שכבה אחרי שכבה.">
  <meta name="theme-color" content="#FBF3E6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath d='M3 17C3 8 9 3 18 3c0 9-5 14-14 14z' fill='%231E7A46'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/Reisinger-Michal-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/img/build-cup.webp" as="image">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap&text=Yogurt">
  <link rel="stylesheet" href="css/styles.css?v=18">
  <link rel="stylesheet" href="css/pages.css?v=4">
</head>
<body>
<main id="main">
  <div class="wrap">
    <ol class="crumbs" style="padding-block-start:22px"><li><a href="index.html">דף הבית</a></li><li aria-current="page">יוגורט בהרכבה</li></ol>
    <div class="bld">
      <div class="bld__stage" aria-hidden="true">
        <div class="bld__cup">
          <span class="bld__ghost" lang="en" dir="ltr">Yogurt</span>
          <div class="bld__plate"></div>
          <span class="sticker sticker--leaf bld__label" data-base-label></span>
          <div class="bld__stack" data-stack>
            <img class="bld__photo" src="assets/img/build-cup.webp" alt="" width="525" height="1100" data-photo>
            <img class="bld__photo is-hidden" src="" alt="" width="525" height="1100" data-sauce-photo>
            <div class="cup__drops" data-drops></div>
          </div>
        </div>
      </div>

      <div class="bld__panel">
        <div>
          <h1 style="font-size:clamp(36px,4.4vw,64px)">יוגורט בהרכבה</h1>
          <p class="phead__lead" style="margin-block-start:10px">בוחרים שלב אחרי שלב, ורואים את הכוס נבנית מול העיניים. פרי שאינו בעונה חוזר כשהעונה שלו מגיעה.</p>
        </div>
        <div>
          <p class="bld__hint" style="margin-block-end:8px">אין כוח לבחור? הרכבות של השף:</p>
          <div class="chefs" data-chefs></div>
        </div>

        <div role="tablist" aria-label="שלבי ההרכבה"><ul class="steps-nav" data-stepsnav></ul></div>
        <div data-panels></div>

        <div class="summary" aria-live="polite">
          <h2>הכוס שלך</h2>
          <p class="summary__note" data-sum-line></p>
          <ul data-sum-chips></ul>
          <div class="summary__row">
            <div><bdi class="summary__price" data-price></bdi><p class="summary__note" data-sum-extra></p></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button type="button" class="btn btn--ghost btn--sm" data-reset>התחלה מחדש</button>
              <button type="button" class="btn btn--primary" data-add>הוספה לסל</button>
            </div>
          </div>
          <p class="fpick__msg" data-msg role="status"></p>
        </div>
      </div>
    </div>
  </div>
  <div class="stickybuy stickybuy--build" data-sticky>
    <img src="assets/img/build-cup.webp" alt="" width="48" height="48">
    <div><strong>יוגורט בהרכבה</strong><bdi data-sprice></bdi></div>
    <button type="button" class="btn btn--primary btn--sm" data-add2>הוספה לסל</button>
  </div>
</main>
<script type="module" src="js/build.js?v=1"></script>
</body>
</html>
